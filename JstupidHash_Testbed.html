<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <title>JstupidHash Testbed</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #idmaindiv {
            margin: 1rem auto;
            max-width: 50rem;
            min-width: 20rem;
            text-align: center;
        }

        #idinputstr {
            display: inline-block;
            font-family: sans-serif;
            font-size: 120%;
            min-height: 10rem;
            margin: 0 auto;
            width: 100%;
        }

        #idrslt {
            margin: 1rem 0;
        }

        #idrsltp {
            color: darkgreen;
            font-family: sans-serif;
            font-size: 120%;
            font-weight: bold;
            margin: 0;
            padding: 0
        }

        label {
            color: blue;
            font-weight: bold;
        }
    </style>
    <script src="jsh256class.js"></script>
</head>

<body>
    <div id="idmaindiv">
        <h1>JstupidHash Testbed!</h1>
        <textarea id="idinputstr"></textarea>
        <div id="idrslt">
            <label for="idrsltp">JstupidHash Output:</label>
            <p id="idrsltp"></p>
        </div>
    </div>
</body>
<script>
    var jsh = new JsH256();
    function doCalc(evt) {
        idrsltp.innerHTML = "Calculating...";
        setTimeout(() => _doCalc(idinputstr.value, idrsltp), 2);
    }
    function _doCalc(txt, rsltp) {
        rsltp.innerHTML = jsh.getDigest(txt);
    }
    idinputstr.addEventListener("input", doCalc);
    {
        idinputstr.value = '';
        doCalc();
    }
</script>

</html>
